paths:
  /auth/sign-up:
    post:
      tags:
        - Authentication
      summary: Inscription utilisateur
      description: Crée un nouvel utilisateur et lui associe un token JWT d'authentification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  example: "test"
                email:
                  type: string
                  format: email
                  example: "test@example.com"
                password:
                  type: string
                  format: password
                  example: "password123"
      responses:
        "201":
          description: Inscription réussie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Inscription réussie"
                  token:
                    type: string
                    example: "example-jwt-token"
                  user:
                    type: object
                    properties:
                      username:
                        type: string
                        example: "test"
                      email:
                        type: string
                        format: email
                        example: "test@example.com"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "409":
          description: Le nom d'utilisateur ou l'email est déjà utilisé.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Nom d'utilisateur déjà utilisé"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/sign-in:
    post:
      tags:
        - Authentication
      summary: Connexion utilisateur
      description: Connecte l'utilisateur et lui associe un token JWT d'authentification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "test@example.com"
                password:
                  type: string
                  format: password
                  example: "password123"
      responses:
        "200":
          description: Connexion réussie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Connexion réussie"
                  token:
                    type: string
                    example: "example-jwt-token"
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          description: L'email ou le mot de passe est incorrect.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Email ou mot de passe incorrect"
        "500":
          $ref: "#/components/responses/ServerError"
