paths:
  /cards:
    get:
      tags:
        - Cards
      summary: Obtention des cartes Pokémon
      description: Obtient toutes les cartes Pokémon disponibles (nécessite une authentification JWT).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cartes obtenues avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Card"
        "401":
          description: Non authentifié ou token JWT invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "500":
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerError"
